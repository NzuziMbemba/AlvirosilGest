<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlviroGest</title>
<style>
  :root { --cor-primaria: #1b5e20; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f6f4;
    color: #222;
  }
  header {
    background: var(--cor-primaria);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .marca { display: flex; align-items: center; gap: 8px; }
  header img { max-height: 32px; }
  header button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  main {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  @media (min-width: 720px) {
    main { grid-template-columns: 1.4fr 1fr; align-items: start; }
  }
  .painel {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .painel h2 { margin-top: 0; font-size: 1.05rem; }
  input[type="search"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 1rem;
  }
  .lista-produtos { max-height: 60vh; overflow-y: auto; }
  .produto {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .produto .nome { font-weight: 500; }
  .produto .stock { font-size: 0.8rem; color: #888; }
  .produto button {
    background: var(--cor-primaria);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .item-carrinho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 0.95rem;
  }
  .item-carrinho .remover {
    color: #c62828;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
  }
  .total {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 1.1rem;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 2px solid #eee;
  }
  #botao-finalizar {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: var(--cor-primaria);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #botao-finalizar:disabled { opacity: 0.5; cursor: not-allowed; }
  .mensagem {
    font-size: 0.9rem;
    margin-top: 10px;
    min-height: 1.2em;
  }
  .mensagem.sucesso { color: #1b5e20; }
  .mensagem.erro { color: #c62828; }
  .papel-badge {
    font-size: 0.7rem;
    background: rgba(255,255,255,0.2);
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="marca">
    <img id="logo-farmacia" style="display:none" alt="Logótipo">
    <strong id="titulo">AlviroGest</strong>
    <span class="papel-badge" id="badge-papel"></span>
  </div>
  <nav style="display:flex; align-items:center; gap:16px">
    <a href="produtos.html" id="link-produtos" style="color:white; font-size:0.9rem; display:none">Produtos</a>
    <a href="configuracoes.html" id="link-configuracoes" style="color:white; font-size:0.9rem; display:none">Configurações</a>
    <button id="botao-sair">Sair</button>
  </nav>
</header>

<main>
  <section class="painel">
    <h2>Produtos</h2>
    <input type="search" id="pesquisa-produto" placeholder="Pesquisar produto...">
    <div class="lista-produtos" id="lista-produtos">A carregar produtos...</div>
  </section>

  <section class="painel">
    <h2>Venda actual</h2>
    <div id="lista-carrinho"><p style="color:#999">Nenhum item ainda.</p></div>
    <div class="total">
      <span>Total</span>
      <span id="total-venda">0,00 Kz</span>
    </div>
    <button id="botao-finalizar" disabled>Finalizar venda</button>
    <div class="mensagem" id="mensagem-venda"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-farmacia.js"></script>
<script src="vendus-integration.js"></script>
<script>
  const SUPABASE_URL = "https://qillinntbhoecurnuheq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Qm5jmqjTg9qAK7df5KRwSQ_44ilsouh";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let produtos = [];
  let carrinho = [];
  let utilizadorId = null;
  let farmaciaId = null;

  const elementoListaProdutos = document.getElementById("lista-produtos");
  const elementoListaCarrinho = document.getElementById("lista-carrinho");
  const elementoTotal = document.getElementById("total-venda");
  const botaoFinalizar = document.getElementById("botao-finalizar");
  const mensagemVenda = document.getElementById("mensagem-venda");
  const campoPesquisa = document.getElementById("pesquisa-produto");

  function formatarKz(valor) {
    return valor.toLocaleString("pt-AO", { minimumFractionDigits: 2 }) + " Kz";
  }

  async function iniciar() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    utilizadorId = user.id;

    const contexto = await AuthFarmacia.carregarContextoFarmacia(supabaseClient);
    if (!contexto) {
      window.location.href = "login.html";
      return;
    }

    farmaciaId = contexto.farmacia.id;
    AuthFarmacia.aplicarMarca(contexto.farmacia);
    document.getElementById("badge-papel").textContent = contexto.papel;
    if (contexto.papel !== "caixa") {
      document.getElementById("link-produtos").style.display = "inline";
    }
    if (contexto.papel === "gerente") {
      document.getElementById("link-configuracoes").style.display = "inline";
    }

    await carregarProdutos();
  }

  async function carregarProdutos() {
    const { data, error } = await supabaseClient
      .from("produtos")
      .select("id, nome, preco_venda, quantidade_stock")
      .order("nome");

    if (error) {
      elementoListaProdutos.textContent = "Erro ao carregar produtos.";
      console.error(error);
      return;
    }

    produtos = data;
    desenharListaProdutos(produtos);
  }

  function desenharListaProdutos(lista) {
    if (lista.length === 0) {
      elementoListaProdutos.innerHTML = "<p style='color:#999'>Nenhum produto encontrado.</p>";
      return;
    }

    elementoListaProdutos.innerHTML = lista.map((produto) => `
      <div class="produto">
        <div>
          <div class="nome">${escaparHtml(produto.nome)}</div>
          <div class="stock">${formatarKz(produto.preco_venda)} · stock: ${produto.quantidade_stock}</div>
        </div>
        <button data-id="${produto.id}" ${produto.quantidade_stock <= 0 ? "disabled" : ""}>
          Adicionar
        </button>
      </div>
    `).join("");

    elementoListaProdutos.querySelectorAll("button[data-id]").forEach((botao) => {
      botao.addEventListener("click", () => adicionarAoCarrinho(botao.dataset.id));
    });
  }

  campoPesquisa.addEventListener("input", () => {
    const termo = campoPesquisa.value.trim().toLowerCase();
    desenharListaProdutos(
      produtos.filter((produto) => produto.nome.toLowerCase().includes(termo)),
    );
  });

  function adicionarAoCarrinho(produtoId) {
    const produto = produtos.find((p) => p.id === produtoId);
    if (!produto) return;

    const itemExistente = carrinho.find((item) => item.produto_id === produtoId);
    if (itemExistente) {
      itemExistente.quantidade += 1;
    } else {
      carrinho.push({
        produto_id: produto.id,
        nome: produto.nome,
        preco_unitario: produto.preco_venda,
        quantidade: 1,
      });
    }
    desenharCarrinho();
  }

  function removerDoCarrinho(produtoId) {
    carrinho = carrinho.filter((item) => item.produto_id !== produtoId);
    desenharCarrinho();
  }

  function desenharCarrinho() {
    if (carrinho.length === 0) {
      elementoListaCarrinho.innerHTML = "<p style='color:#999'>Nenhum item ainda.</p>";
      botaoFinalizar.disabled = true;
      elementoTotal.textContent = formatarKz(0);
      return;
    }

    elementoListaCarrinho.innerHTML = carrinho.map((item) => `
      <div class="item-carrinho">
        <span>${item.quantidade}× ${escaparHtml(item.nome)}</span>
        <span>
          ${formatarKz(item.preco_unitario * item.quantidade)}
          <button class="remover" data-id="${item.produto_id}" title="Remover">✕</button>
        </span>
      </div>
    `).join("");

    elementoListaCarrinho.querySelectorAll(".remover").forEach((botao) => {
      botao.addEventListener("click", () => removerDoCarrinho(botao.dataset.id));
    });

    const total = carrinho.reduce((soma, item) => soma + item.preco_unitario * item.quantidade, 0);
    elementoTotal.textContent = formatarKz(total);
    botaoFinalizar.disabled = false;
  }

  botaoFinalizar.addEventListener("click", async () => {
    botaoFinalizar.disabled = true;
    botaoFinalizar.textContent = "A gravar...";
    mensagemVenda.textContent = "";
    mensagemVenda.className = "mensagem";

    try {
      const { data: resultado, error: erroVenda } = await supabaseClient.rpc(
        "finalizar_venda",
        {
          p_itens: carrinho.map((item) => ({
            produto_id: item.produto_id,
            quantidade: item.quantidade,
          })),
        },
      );

      if (erroVenda) throw erroVenda;

      const vendaRegistada = resultado[0];
      mensagemVenda.textContent = `Venda registada (${formatarKz(vendaRegistada.total)}). A emitir factura...`;
      mensagemVenda.classList.add("sucesso");

      const factura = await VendusIntegration.emitirFactura(vendaRegistada.venda_id);

      if (factura.contingencia) {
        mensagemVenda.textContent =
          `Venda registada (${formatarKz(vendaRegistada.total)}). ` +
          `Factura em contingência — será emitida assim que a ligação for restabelecida.`;
      } else {
        mensagemVenda.textContent =
          `Venda registada. Factura ${factura.numero_factura} emitida.`;
      }

      carrinho = [];
      desenharCarrinho();
      await carregarProdutos();
    } catch (erro) {
      console.error(erro);
      mensagemVenda.textContent = erro.message?.includes("Stock insuficiente")
        ? "Stock insuficiente para um dos produtos — outra caixa pode tê-lo vendido primeiro."
        : "Não foi possível registar a venda.";
      mensagemVenda.classList.add("erro");
    } finally {
      botaoFinalizar.textContent = "Finalizar venda";
      botaoFinalizar.disabled = carrinho.length === 0;
    }
  });

  document.getElementById("botao-sair").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    AuthFarmacia.limparContexto();
    window.location.href = "login.html";
  });

  function escaparHtml(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
  }

  iniciar();
</script>

</body>
</html>
