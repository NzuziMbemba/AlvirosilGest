<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlviroGest — Produtos</title>
<style>
  :root { --cor-primaria: #1b5e20; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f6f4;
    color: #222;
  }
  header {
    background: var(--cor-primaria);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header .marca { display: flex; align-items: center; gap: 8px; }
  header img { max-height: 32px; }
  header nav { display: flex; flex-wrap: wrap; gap: 14px; }
  header nav a {
    color: white;
    text-decoration: none;
    font-size: 0.9rem;
    opacity: 0.9;
  }
  header nav a.activo { font-weight: 700; opacity: 1; text-decoration: underline; }
  header nav a.so-gerente { display: none; }
  main {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  @media (min-width: 720px) {
    main { grid-template-columns: 1fr 1.3fr; align-items: start; }
  }
  .painel {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .painel h2 { margin-top: 0; font-size: 1.05rem; }
  label {
    display: block;
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
  }
  button.principal {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: var(--cor-primaria);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.secundario {
    background: none;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; }
  .acoes { display: flex; gap: 6px; }
  .mensagem { font-size: 0.9rem; margin-top: 10px; min-height: 1.2em; }
  .mensagem.sucesso { color: #1b5e20; }
  .mensagem.erro { color: #c62828; }
  .aviso-acesso {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: #555;
  }
</style>
</head>
<body>

<div id="topo" class="nao-imprimir"></div>

<main id="conteudo-principal" style="display:none">
  <section class="painel">
    <h2 id="titulo-formulario">Novo produto</h2>
    <form id="form-produto">
      <input type="hidden" id="produto-id">

      <label for="nome">Nome</label>
      <input type="text" id="nome" required>

      <label for="codigo-barras">Código de barras (opcional)</label>
      <input type="text" id="codigo-barras">

      <label for="categoria">Categoria (ex.: Analgésicos)</label>
      <input type="text" id="categoria" list="lista-categorias" maxlength="60" autocomplete="off" placeholder="Escolha ou escreva uma nova">
      <datalist id="lista-categorias">
        <option value="Analgésicos e antipiréticos">
        <option value="Anestésicos locais">
        <option value="Anti-inflamatórios">
        <option value="Corticosteróides">
        <option value="Antibióticos">
        <option value="Antifúngicos">
        <option value="Antivirais">
        <option value="Antipalúdicos">
        <option value="Antiparasitários e antihelmínticos">
        <option value="Antituberculosos">
        <option value="Antirretrovirais">
        <option value="Anti-histamínicos e antialérgicos">
        <option value="Antiácidos e anti-ulcerosos">
        <option value="Antieméticos">
        <option value="Antidiarreicos e reidratantes orais">
        <option value="Laxantes">
        <option value="Antiespasmódicos">
        <option value="Digestivos e hepatoprotectores">
        <option value="Anti-hipertensivos">
        <option value="Diuréticos">
        <option value="Cardiovasculares">
        <option value="Anticoagulantes e antiagregantes">
        <option value="Hipolipemiantes">
        <option value="Antidiabéticos orais">
        <option value="Insulinas">
        <option value="Tiroide">
        <option value="Antitússicos e expectorantes">
        <option value="Broncodilatadores e antiasmáticos">
        <option value="Descongestionantes nasais">
        <option value="Anticonvulsivantes">
        <option value="Antidepressivos">
        <option value="Ansiolíticos e hipnóticos">
        <option value="Antipsicóticos">
        <option value="Antiparkinsónicos">
        <option value="Relaxantes musculares">
        <option value="Antienxaquecas">
        <option value="Anti-gotosos">
        <option value="Cálcio e osteoporose">
        <option value="Vitaminas">
        <option value="Minerais e suplementos">
        <option value="Tónicos e estimulantes do apetite">
        <option value="Contraceptivos">
        <option value="Saúde da mulher e ginecológicos">
        <option value="Hormonas">
        <option value="Saúde do homem e urológicos">
        <option value="Dermatológicos">
        <option value="Antissépticos e desinfectantes">
        <option value="Cicatrizantes e tratamento de feridas">
        <option value="Oftálmicos">
        <option value="Otológicos">
        <option value="Saúde oral e dentária">
        <option value="Vacinas">
        <option value="Soros e fluidos endovenosos">
        <option value="Injectáveis">
        <option value="Material de penso">
        <option value="Material descartável">
        <option value="Dispositivos médicos">
        <option value="Testes rápidos">
        <option value="Higiene pessoal">
        <option value="Cosmética e cuidados da pele">
        <option value="Bebé e puericultura">
        <option value="Nutrição e leites infantis">
        <option value="Fitoterapia e produtos naturais">
        <option value="Preservativos">
        <option value="Repelentes e protecção solar">
        <option value="Veterinários">
        <option value="Outros">
      </datalist>

      <label for="preco-venda">Preço de venda (Kz)</label>
      <input type="number" id="preco-venda" min="0" step="0.01" required>

      <label for="quantidade-stock">Quantidade em stock</label>
      <input type="number" id="quantidade-stock" min="0" step="1" required>

      <label for="categoria-imposto">Categoria de imposto</label>
      <select id="categoria-imposto">
        <option value="NOR">Normal</option>
        <option value="ISE">Isento</option>
        <option value="RED">Taxa reduzida</option>
      </select>

      <button type="submit" class="principal" id="botao-guardar">Guardar produto</button>
      <button type="button" class="secundario" id="botao-cancelar" style="display:none; margin-top:8px; width:100%">
        Cancelar edição
      </button>
    </form>
    <div class="mensagem" id="mensagem-produto"></div>
  </section>

  <section class="painel">
    <h2>Produtos existentes</h2>
    <input type="search" id="pesquisa-produto" placeholder="Pesquisar..." style="margin-bottom:8px">
    <select id="filtro-categoria" style="margin-bottom:12px">
      <option value="">Todas as categorias</option>
    </select>
    <table>
      <thead>
        <tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Stock</th><th></th></tr>
      </thead>
      <tbody id="corpo-tabela-produtos">
        <tr><td colspan="5">A carregar...</td></tr>
      </tbody>
    </table>
  </section>
</main>

<div class="aviso-acesso" id="aviso-sem-acesso" style="display:none">
  <p>Esta área é só para Gerente ou Farmacêutico.</p>
  <a href="app.html">Voltar às vendas</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-farmacia.js"></script>
<script src="menu.js"></script>
<script>
  const SUPABASE_URL = "https://qillinntbhoecurnuheq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Qm5jmqjTg9qAK7df5KRwSQ_44ilsouh";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let produtos = [];

  const form = document.getElementById("form-produto");
  const botaoGuardar = document.getElementById("botao-guardar");
  const botaoCancelar = document.getElementById("botao-cancelar");
  const tituloFormulario = document.getElementById("titulo-formulario");
  const mensagemProduto = document.getElementById("mensagem-produto");
  const corpoTabela = document.getElementById("corpo-tabela-produtos");
  const campoPesquisa = document.getElementById("pesquisa-produto");
  const filtroCategoria = document.getElementById("filtro-categoria");

  function formatarKz(valor) {
    return Number(valor).toLocaleString("pt-AO", { minimumFractionDigits: 2 }) + " Kz";
  }

  async function iniciar() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }

    const contexto = await AuthFarmacia.carregarContextoFarmacia(supabaseClient);
    if (!contexto) { window.location.href = "login.html"; return; }

    const _u = (await supabaseClient.auth.getUser()).data.user;
    MenuAlviro.montar({ papel: contexto.papel, activo: "produtos", nome: _u?.user_metadata?.nome || (_u?.email || "").split("@")[0],
      aoSair: async () => { await supabaseClient.auth.signOut(); try { AuthFarmacia.limparContexto(); } catch (_) {} window.location.href = "login.html"; } });
    AuthFarmacia.aplicarMarca(contexto.farmacia);

    if (contexto.papel === "caixa") {
      document.getElementById("aviso-sem-acesso").style.display = "block";
      return;
    }

    if (contexto.papel === "gerente") {
      document.querySelectorAll("header nav a.so-gerente").forEach((a) => {
        a.style.display = "inline";
      });
    }

    document.getElementById("conteudo-principal").style.display = "grid";
    await carregarProdutos();
  }

  async function carregarProdutos() {
    const { data, error } = await supabaseClient
      .from("produtos")
      .select("id, nome, codigo_barras, categoria, preco_venda, quantidade_stock, categoria_imposto")
      .order("nome");

    if (error) {
      corpoTabela.innerHTML = "<tr><td colspan='5'>Erro ao carregar produtos.</td></tr>";
      console.error(error);
      return;
    }

    produtos = data;
    actualizarFiltroCategorias();
    aplicarFiltros();
  }

  function desenharTabela(lista) {
    if (lista.length === 0) {
      corpoTabela.innerHTML = "<tr><td colspan='5'>Nenhum produto ainda.</td></tr>";
      return;
    }

    corpoTabela.innerHTML = lista.map((produto) => `
      <tr>
        <td>${escaparHtml(produto.nome)}</td>
        <td>${escaparHtml(produto.categoria || "—")}</td>
        <td>${formatarKz(produto.preco_venda)}</td>
        <td>${produto.quantidade_stock}</td>
        <td class="acoes">
          <button class="secundario" data-editar="${produto.id}">Editar</button>
        </td>
      </tr>
    `).join("");

    corpoTabela.querySelectorAll("[data-editar]").forEach((botao) => {
      botao.addEventListener("click", () => carregarNoFormulario(botao.dataset.editar));
    });
  }

  function actualizarFiltroCategorias() {
    const escolhida = filtroCategoria.value;
    const categorias = [...new Set(produtos.map((p) => p.categoria).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, "pt"));
    filtroCategoria.innerHTML = '<option value="">Todas as categorias</option>' +
      categorias.map((c) => `<option value="${escaparHtml(c).replace(/"/g, "&quot;")}">${escaparHtml(c)}</option>`).join("") +
      '<option value="__sem__">Sem categoria</option>';
    filtroCategoria.value = [...filtroCategoria.options].some((o) => o.value === escolhida) ? escolhida : "";
  }

  function aplicarFiltros() {
    const termo = campoPesquisa.value.trim().toLowerCase();
    const categoria = filtroCategoria.value;
    desenharTabela(produtos.filter((p) => {
      const passaNome = p.nome.toLowerCase().includes(termo);
      const passaCategoria =
        !categoria ||
        (categoria === "__sem__" ? !p.categoria : p.categoria === categoria);
      return passaNome && passaCategoria;
    }));
  }

  campoPesquisa.addEventListener("input", aplicarFiltros);
  filtroCategoria.addEventListener("change", aplicarFiltros);

  function carregarNoFormulario(produtoId) {
    const produto = produtos.find((p) => p.id === produtoId);
    if (!produto) return;

    document.getElementById("produto-id").value = produto.id;
    document.getElementById("nome").value = produto.nome;
    document.getElementById("codigo-barras").value = produto.codigo_barras || "";
    document.getElementById("categoria").value = produto.categoria || "";
    document.getElementById("preco-venda").value = produto.preco_venda;
    document.getElementById("quantidade-stock").value = produto.quantidade_stock;
    document.getElementById("categoria-imposto").value = produto.categoria_imposto || "NOR";

    tituloFormulario.textContent = "Editar produto";
    botaoGuardar.textContent = "Guardar alterações";
    botaoCancelar.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function limparFormulario() {
    form.reset();
    document.getElementById("produto-id").value = "";
    tituloFormulario.textContent = "Novo produto";
    botaoGuardar.textContent = "Guardar produto";
    botaoCancelar.style.display = "none";
  }

  botaoCancelar.addEventListener("click", limparFormulario);

  form.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    mensagemProduto.textContent = "";
    mensagemProduto.className = "mensagem";

    const produtoId = document.getElementById("produto-id").value;
    const dados = {
      nome: document.getElementById("nome").value.trim(),
      codigo_barras: document.getElementById("codigo-barras").value.trim() || null,
      categoria: document.getElementById("categoria").value.trim() || null,
      preco_venda: Number(document.getElementById("preco-venda").value),
      quantidade_stock: Number(document.getElementById("quantidade-stock").value),
      categoria_imposto: document.getElementById("categoria-imposto").value,
    };

    try {
      if (produtoId) {
        const { error } = await supabaseClient.from("produtos").update(dados).eq("id", produtoId);
        if (error) throw error;
        mensagemProduto.textContent = "Produto actualizado.";
      } else {
        const contexto = await AuthFarmacia.carregarContextoFarmacia(supabaseClient);
        const { error } = await supabaseClient.from("produtos").insert({
          ...dados,
          farmacia_id: contexto.farmacia.id,
        });
        if (error) throw error;
        mensagemProduto.textContent = "Produto criado.";
      }

      mensagemProduto.classList.add("sucesso");
      limparFormulario();
      await carregarProdutos();
    } catch (erro) {
      console.error(erro);
      mensagemProduto.textContent = "Não foi possível guardar o produto.";
      mensagemProduto.classList.add("erro");
    }
  });

  function escaparHtml(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
  }

  iniciar();
</script>

</body>
</html>
