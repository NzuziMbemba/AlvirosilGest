<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlviroGest — Configurações</title>
<style>
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  h2.tit { font-size: 1.3rem; margin: 6px 0 12px; }
  .painel { background: var(--cartao); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 20px; }
  label { display: block; font-size: .85rem; color: var(--suave); margin: 12px 0 4px; }
  input { width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 8px; font-size: 1rem; background: var(--fundo); color: var(--texto); }
  input[type="color"] { padding: 4px; height: 44px; }
  button.principal { width: 100%; margin-top: 16px; padding: 12px; background: var(--cor-primaria); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .msg { font-size: .9rem; margin-top: 10px; min-height: 1.2em; } .msg.ok { color: #1b7a2e; } .msg.erro { color: #c62828; }
  .aviso-acesso { max-width: 480px; margin: 60px auto; text-align: center; color: var(--suave); }
</style>
</head>
<body>
<div id="topo"></div>
<main id="conteudo" hidden>
  <h2 class="tit">⚙️ Configurações</h2>

  <section class="painel">
    <form id="form-marca">
      <label for="nome-farmacia">Nome</label>
      <input type="text" id="nome-farmacia" required>

      <label for="nif-farmacia">NIF</label>
      <input type="text" id="nif-farmacia">

      <label for="logo-url">URL do logótipo (opcional)</label>
      <input type="url" id="logo-url" placeholder="https://...">

      <label for="cor-primaria">Cor principal</label>
      <input type="color" id="cor-primaria">

      <button type="submit" class="principal">Guardar</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>
</main>

<div class="aviso-acesso" id="aviso-sem-acesso" hidden>
  <p>Não tens acesso a esta área.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-farmacia.js"></script>
<script src="menu.js"></script>
<script>
  const supabaseClient = window.supabase.createClient("https://qillinntbhoecurnuheq.supabase.co", "sb_publishable_Qm5jmqjTg9qAK7df5KRwSQ_44ilsouh");
  const $ = (id) => document.getElementById(id);
  let farmaciaAtual = null;

  async function iniciar() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { location.href = "login.html"; return; }
    const ctx = await AuthFarmacia.carregarContextoFarmacia(supabaseClient);
    if (!ctx) { location.href = "login.html"; return; }

    MenuAlviro.montar({ papel: ctx.papel, activo: "configuracoes", nome: user.user_metadata?.nome || (user.email || "").split("@")[0],
      aoSair: async () => { await supabaseClient.auth.signOut(); try { AuthFarmacia.limparContexto(); } catch (_) {} location.href = "login.html"; } });
    AuthFarmacia.aplicarMarca(ctx.farmacia);

    if (!["gerente", "gerente_administrativo", "rh", "secretario"].includes(ctx.papel)) {
      $("aviso-sem-acesso").hidden = false;
      return;
    }

    farmaciaAtual = ctx.farmacia;
    $("conteudo").hidden = false;
    $("nome-farmacia").value = farmaciaAtual.nome || "";
    $("nif-farmacia").value = farmaciaAtual.nif || "";
    $("logo-url").value = farmaciaAtual.logo_url || "";
    $("cor-primaria").value = farmaciaAtual.cor_primaria || "#1b5e20";
  }

  $("form-marca").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg"); msg.textContent = ""; msg.className = "msg";

    const dados = {
      nome: $("nome-farmacia").value.trim(),
      nif: $("nif-farmacia").value.trim() || null,
      logo_url: $("logo-url").value.trim() || null,
      cor_primaria: $("cor-primaria").value,
    };

    const { error } = await supabaseClient.from("farmacias").update(dados).eq("id", farmaciaAtual.id);
    if (error) {
      msg.textContent = "Não foi possível guardar.";
      msg.classList.add("erro");
      console.error(error);
      return;
    }

    msg.textContent = "Marca actualizada.";
    msg.classList.add("ok");
    AuthFarmacia.limparContexto();
    AuthFarmacia.aplicarMarca({ ...farmaciaAtual, ...dados });
  });

  iniciar();
</script>
</body>
</html>
