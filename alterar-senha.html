<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlviroGest — Alterar Palavra-passe</title>
<style>
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 16px; }
  h2.tit { font-size: 1.3rem; margin: 6px 0 12px; }
  .painel { background: var(--cartao); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 20px; }
  label { display: block; font-size: .85rem; color: var(--suave); margin: 12px 0 4px; }
  input { width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 8px; font-size: 1rem; background: var(--fundo); color: var(--texto); }
  .ajuda { font-size: .78rem; color: var(--suave); margin-top: 4px; }
  button.principal { width: 100%; margin-top: 18px; padding: 12px; background: var(--cor-primaria); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button.principal:disabled { opacity: .6; cursor: not-allowed; }
  .msg { font-size: .9rem; margin-top: 10px; min-height: 1.2em; } .msg.ok { color: #1b7a2e; } .msg.erro { color: #c62828; }
</style>
</head>
<body>
<div id="topo"></div>
<main id="conteudo" hidden>
  <h2 class="tit">🔑 Alterar Palavra-passe</h2>

  <section class="painel">
    <form id="form-senha">
      <label for="senha-nova">Nova palavra-passe</label>
      <input type="password" id="senha-nova" required minlength="6" autocomplete="new-password">
      <div class="ajuda">Mínimo 6 caracteres.</div>

      <label for="senha-confirmar">Confirmar nova palavra-passe</label>
      <input type="password" id="senha-confirmar" required minlength="6" autocomplete="new-password">

      <button type="submit" class="principal" id="botao-guardar">Guardar nova palavra-passe</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-farmacia.js"></script>
<script src="menu.js"></script>
<script>
  const supabaseClient = window.supabase.createClient("https://qillinntbhoecurnuheq.supabase.co", "sb_publishable_Qm5jmqjTg9qAK7df5KRwSQ_44ilsouh");
  const $ = (id) => document.getElementById(id);

  async function iniciar() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { location.href = "login.html"; return; }
    const ctx = await AuthFarmacia.carregarContextoFarmacia(supabaseClient);
    if (!ctx) { location.href = "login.html"; return; }
    MenuAlviro.montar({ papel: ctx.papel, activo: "senha", nome: user.user_metadata?.nome || (user.email || "").split("@")[0],
      aoSair: async () => { await supabaseClient.auth.signOut(); try { AuthFarmacia.limparContexto(); } catch (_) {} location.href = "login.html"; } });
    AuthFarmacia.aplicarMarca(ctx.farmacia);
    $("conteudo").hidden = false;
  }

  $("form-senha").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg"), botao = $("botao-guardar");
    msg.textContent = ""; msg.className = "msg";

    const nova = $("senha-nova").value;
    const confirmar = $("senha-confirmar").value;

    if (nova !== confirmar) {
      msg.textContent = "As duas palavras-passe não coincidem.";
      msg.classList.add("erro");
      return;
    }

    botao.disabled = true; botao.textContent = "A guardar...";
    const { error } = await supabaseClient.auth.updateUser({ password: nova });
    botao.disabled = false; botao.textContent = "Guardar nova palavra-passe";

    if (error) {
      msg.textContent = "Não foi possível alterar: " + error.message;
      msg.classList.add("erro");
      return;
    }

    msg.textContent = "Palavra-passe alterada com sucesso.";
    msg.classList.add("ok");
    $("form-senha").reset();
  });

  iniciar();
</script>
</body>
</html>
